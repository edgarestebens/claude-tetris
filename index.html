<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="header-row">
      <h1 class="game-title">TETRIS</h1>
      <div class="theme-toggle">
        <span class="theme-icon theme-icon-dark">🌙</span>
        <label class="theme-switch" role="switch" aria-checked="false">
          <input type="checkbox" id="theme-toggle-input" aria-label="Cambiar a modo claro">
          <span class="theme-slider"></span>
        </label>
        <span class="theme-icon theme-icon-light">☀️</span>
      </div>
    </div>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>
        <div class="panel-section">
          <span class="label">COMBO</span>
          <span class="value" id="combo">0</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay">
      <div class="overlay-box">
        <p id="overlay-title">TETRIS</p>
        <p id="overlay-score"></p>
        <p id="new-record-msg" class="new-record-msg hidden">¡Nuevo récord!</p>

        <div id="name-entry" class="name-entry hidden">
          <label for="player-name">Tu nombre</label>
          <div class="name-entry-row">
            <input type="text" id="player-name" maxlength="12" placeholder="Jugador" autocomplete="off" />
            <button type="button" id="save-score-btn">Guardar</button>
          </div>
        </div>

        <div id="records-panel" class="records-panel">
          <span class="label">TOP 5</span>
          <ol id="records-list" class="records-list"></ol>
          <div class="records-stats">
            <span>Mejor combo: <strong id="stat-best-combo">0</strong></span>
            <span>Líneas máx: <strong id="stat-max-lines">0</strong></span>
          </div>
          <button type="button" id="reset-records-btn" class="btn-secondary">Resetear records</button>
        </div>

        <button id="restart-btn">Jugar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
